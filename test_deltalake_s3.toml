# Test configuration for DeltaLake sink with S3 support - 完全参考 aws_s3_upload_file 的配置格式
# 对应您提供的配置示例

[sources.conprof_add_meta]
type = "stdin"
decoding.codec = "json"

[sinks.conprof_s3]
type = "deltalake"
inputs = ["conprof_add_meta"]

# Delta Lake S3 配置 - 完全参考 aws_s3_upload_file
base_path = "s3://o11y-test-shared-us-west-2/deltalake-tables"
bucket = "o11y-test-shared-us-west-2"

# AWS 认证配置 - 与 aws_s3_upload_file 完全一致
region = "${REGION}"
auth.assume_role = "xxxxxxx"

# S3 选项 - 现在支持与 aws_s3_upload_file 相同的所有选项
storage_class = "STANDARD"
server_side_encryption = "AES256"
force_path_style = false

# TLS 配置支持
tls.verify_certificate = true
tls.verify_hostname = true

# Delta Lake 特定配置
batch_size = 1
timeout_secs = 1
compression = "snappy"

# 存储选项 (可选)
storage_options.AWS_STORAGE_ALLOW_HTTP = "true"

# 确认配置
acknowledgements.enabled = true

# 本地文件系统配置示例 (向后兼容)
[sinks.conprof_local]
type = "deltalake"
inputs = ["conprof_add_meta"]
base_path = "./delta-tables"
batch_size = 1000
timeout_secs = 30
compression = "snappy"
acknowledgements.enabled = true
