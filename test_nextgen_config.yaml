sources:
  system_tables:
    type: "system_tables"
    # Nextgen mode configuration - no pd_address needed
    tidb_group: "tidb-cluster"
    label_k8s_instance: "tidb-instance"
    database_username: "root"
    database_password: ""
    database_host: "127.0.0.1"  # Will be overridden by K8s discovery
    database_port: 4000         # Will be overridden by K8s discovery
    database_name: "test"
    database_max_connections: 10
    database_connect_timeout: 30
    short_interval: 5
    long_interval: 60
    retention_days: 1
    topology_fetch_interval_seconds: 30.0
    tables:
      - source_schema: "information_schema"
        source_table: "PROCESSLIST"
        dest_table: "hist_processlist"
        collection_interval: "short"
        where_clause: "command != 'Sleep'"
        enabled: true
      - source_schema: "information_schema"
        source_table: "CLUSTER_STATEMENTS_SUMMARY"
        dest_table: "hist_cluster_statements_summary"
        collection_interval: "long"
        enabled: true

sinks:
  deltalake:
    type: "deltalake"
    inputs: ["system_tables"]
    base_path: "./delta-tables-nextgen"
    batch_size: 1000
    timeout_secs: 30
    compression: "snappy"
