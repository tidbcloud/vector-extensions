name: build_image

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOCKER_REPO: slggamer/vector

jobs:
  build-and-push-images:
    name: Build Images & Push To Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Set up Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rustfmt clippy
          # Install lld linker for faster linking (optional, falls back to default if unavailable)
          sudo apt-get update && sudo apt-get install -y lld || echo "lld not available, using default linker"

      - name: Check disk space
        run: |
          df -h
          echo "Available disk space before build:"
          df -h . | tail -1

      - name: Install cross
        run: cargo install cross

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set build date and tags
        id: set_tags
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag=${{ env.DOCKER_REPO }}:nightly-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag_ng=${{ env.DOCKER_REPO }}:nightly-${SHA_SHORT}-ng" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: slggamer
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build x86_64 binary (standard)
        timeout-minutes: 60
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_BUILD_JOBS: 4
          CARGO_INCREMENTAL: 0
        run: |
          echo "Starting x86_64 build at $(date)"
          make build-x86_64-unknown-linux-gnu
          echo "Finished x86_64 build at $(date)"
          # Clean up intermediate files to save disk space
          find target/x86_64-unknown-linux-gnu/release/deps -name "*.rlib" -not -name "libvector*.rlib" -delete 2>/dev/null || true
          find target/x86_64-unknown-linux-gnu/release/build -type f -name "*.o" -delete 2>/dev/null || true

      - name: Build aarch64 binary (standard)
        timeout-minutes: 60
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_BUILD_JOBS: 4
          CARGO_INCREMENTAL: 0
        run: |
          echo "Starting aarch64 build at $(date)"
          make build-aarch64-unknown-linux-gnu
          echo "Finished aarch64 build at $(date)"
          # Clean up intermediate files to save disk space
          find target/aarch64-unknown-linux-gnu/release/deps -name "*.rlib" -not -name "libvector*.rlib" -delete 2>/dev/null || true
          find target/aarch64-unknown-linux-gnu/release/build -type f -name "*.o" -delete 2>/dev/null || true

      - name: Build and push standard image
        env:
          REPO: ${{ env.DOCKER_REPO }}
          TAG: ${{ steps.set_tags.outputs.tag }}
        run: make release-docker

      - name: Clean up standard build artifacts
        run: |
          # Remove standard build artifacts after Docker image is built
          rm -rf target/x86_64-unknown-linux-gnu/release/build
          rm -rf target/aarch64-unknown-linux-gnu/release/build
          find target/x86_64-unknown-linux-gnu/release/deps -type f ! -name "*.rlib" -delete 2>/dev/null || true
          find target/aarch64-unknown-linux-gnu/release/deps -type f ! -name "*.rlib" -delete 2>/dev/null || true
          # Keep only the final binaries
          df -h
          echo "Available disk space after Cleaned up intermediate build artifacts:"
          df -h . | tail -1

      - name: Build x86_64 binary (nextgen)
        timeout-minutes: 60
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_BUILD_JOBS: 4
          CARGO_INCREMENTAL: 0
        run: |
          echo "Starting x86_64 nextgen build at $(date)"
          make build-x86_64-unknown-linux-gnu-nextgen
          echo "Finished x86_64 nextgen build at $(date)"
          # Clean up intermediate files to save disk space
          find target/x86_64-unknown-linux-gnu/release/deps -name "*.rlib" -not -name "libvector*.rlib" -delete 2>/dev/null || true
          find target/x86_64-unknown-linux-gnu/release/build -type f -name "*.o" -delete 2>/dev/null || true

      - name: Build aarch64 binary (nextgen)
        timeout-minutes: 60
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_BUILD_JOBS: 4
          CARGO_INCREMENTAL: 0
        run: |
          echo "Starting aarch64 nextgen build at $(date)"
          make build-aarch64-unknown-linux-gnu-nextgen
          echo "Finished aarch64 nextgen build at $(date)"
          # Clean up intermediate files to save disk space
          find target/aarch64-unknown-linux-gnu/release/deps -name "*.rlib" -not -name "libvector*.rlib" -delete 2>/dev/null || true
          find target/aarch64-unknown-linux-gnu/release/build -type f -name "*.o" -delete 2>/dev/null || true

      - name: Build and push nextgen image
        env:
          REPO: ${{ env.DOCKER_REPO }}
          TAG: ${{ steps.set_tags.outputs.tag_ng }}
          NEXTGEN: "true"
        run: make release-docker-nextgen

      - name: Build Summary
        run: |
          echo "✅ Vector images built and pushed successfully!"
          echo ""
          echo "📦 **Built Images:**"
          echo "- **Standard:** \`${{ steps.set_tags.outputs.tag }}\`"
          echo "- **Nextgen:** \`${{ steps.set_tags.outputs.tag_ng }}\`"
          echo ""
          echo "🔍 **Git SHA:** ${{ github.sha }}"
          echo "📅 **Build Date:** ${{ steps.set_tags.outputs.build_date }}"

      - name: Final cleanup and disk space check
        if: always()
        run: |
          echo "Final disk space usage:"
          df -h .
          echo ""
          echo "Target directory size:"
          du -sh target 2>/dev/null || echo "target directory not found"
          echo ""
          echo "Cleaning up remaining build artifacts..."
          # Remove all build artifacts except final binaries
          find target -type d -name "build" -exec rm -rf {} + 2>/dev/null || true
          find target -type f -name "*.o" -delete 2>/dev/null || true
          find target -type f -name "*.d" -delete 2>/dev/null || true
          find target -type f -name "*.rmeta" -delete 2>/dev/null || true
          echo "Cleanup completed"
          df -h .
