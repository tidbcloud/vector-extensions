name: build_image

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GCR_REPO: gcr.io/pingcap-public/dbaas/vector

jobs:
  build-and-push-images:
    name: Build Images & Push To GCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.git-ref || github.sha }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rustfmt clippy

      - name: Install cross
        run: cargo install cross

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set build date and tags
        id: set_tags
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag=${{ env.GCR_REPO }}:nightly-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag_ng=${{ env.GCR_REPO }}:nightly-${SHA_SHORT}-ng" >> $GITHUB_OUTPUT

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0

      - name: Configure Gcloud
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build x86_64 and aarch64 binaries (standard)
        run: |
          make build-x86_64-unknown-linux-gnu
          JEMALLOC_SYS_WITH_LG_PAGE=16 make build-aarch64-unknown-linux-gnu

      - name: Build and push standard image
        env:
          REPO: ${{ env.GCR_REPO }}
          TAG: ${{ steps.set_tags.outputs.tag }}
        run: make release-docker

      - name: Build x86_64 and aarch64 binaries (nextgen)
        run: |
          make build-x86_64-unknown-linux-gnu-nextgen
          JEMALLOC_SYS_WITH_LG_PAGE=16 make build-aarch64-unknown-linux-gnu-nextgen

      - name: Build and push nextgen image
        env:
          REPO: ${{ env.GCR_REPO }}
          TAG: ${{ steps.set_tags.outputs.tag_ng }}
          NEXTGEN: "true"
        run: make release-docker-nextgen

      - name: Build Summary
        run: |
          echo "✅ Vector images built and pushed successfully!"
          echo ""
          echo "📦 **Built Images:**"
          echo "- **Standard:** \`${{ steps.set_tags.outputs.tag }}\`"
          echo "- **Nextgen:** \`${{ steps.set_tags.outputs.tag_ng }}\`"
          echo ""
          echo "🔍 **Git SHA:** ${{ github.sha }}"
          echo "📅 **Build Date:** ${{ steps.set_tags.outputs.build_date }}"
