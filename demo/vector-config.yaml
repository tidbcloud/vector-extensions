apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-s3-sync-config
  namespace: default
data:
  vector.toml: |
    # Top-level data_dir: sink disk buffer etc. write here
    data_dir = "/var/lib/vector"

    # Enable API: health check /health, management
    [api]
    enabled = true
    address = "0.0.0.0:8686"
    playground = false

    # Internal metrics source: Vector's own metrics (throughput, buffer, errors)
    [sources.internal_metrics]
    type = "internal_metrics"
    scrape_interval_secs = 15

    [sources.file_list]
    type = "file_list"
    endpoint = "s3://o11y-dev-shared-us-west-2"
    # file_list checkpoint dir: after OOM/restart resume from completed prefix
    data_dir = "/var/lib/vector/file_list_checkpoint"
    cloud_provider = "aws"
    max_keys = 10000
    poll_interval_secs = 0
    emit_metadata = true
    emit_content = true
    emit_per_line = "auto"
    # Files larger than this use streaming (by line) to avoid one huge event and sink BufferTooSmall
    stream_file_above_bytes = 6553600
    # Parallelism: process 2 files at once (decompress + S3 read) to use both cores
    stream_concurrency = 2
    # flush_after_each_file default true for output rate; no max_content_buffer_bytes — source writes to sink directly, sink buffer handles batching
    decompress_gzip = true
    region = "us-west-2"
    cluster_id = "1143514"
    types = [ "raw_logs" ]
    start_time = "2026-02-02T11:00:00Z"
    end_time = "2026-02-04T13:59:59Z"
    raw_log_components = [ "tidb", "ticdc", "pd", "tiflash", "tikv" ]

    [sinks.to_s3]
    type = "aws_s3"
    inputs = [ "file_list" ]
    bucket = "o11y-dev-shared-us-west-2"
    # Ensure these fields exist in event metadata or key_prefix will error
    key_prefix = "leotest4/{{ component }}/{{ hour_partition }}/"
    # gzip to S3 uses CPU; set compression = "none" to save CPU if downstream does not require it (more bandwidth/storage)
    compression = "gzip"
    region = "us-west-2"

    [sinks.to_s3.encoding]
    codec = "text"

    [sinks.to_s3.batch]
    max_bytes = 1035544320
    max_events = 10000000
    timeout_secs = 30

    [sinks.to_s3.buffer]
    type = "disk"
    max_size = 536870912
    when_full = "block"   # Block when full to protect memory

    # Prometheus-format metrics for scraping
    [sinks.prometheus_exporter]
    type = "prometheus_exporter"
    inputs = [ "internal_metrics" ]
    address = "0.0.0.0:9598"
    default_namespace = "vector"
