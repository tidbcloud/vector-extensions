apiVersion: batch/v1
kind: Job
metadata:
  name: vector-s3-migration
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: vector
        #image: 552185537300.dkr.ecr.us-west-2.amazonaws.com/dev/vector:nightly-52d4d16-modified-5
        image: slggamer/vector:s3sync
        imagePullPolicy: Always
        # s3-sync 镜像以脚本为入口，无需 Vector 的 args；配置路径需与下面 volumeMount 一致
        env:
        - name: CONFIG_FILE
          value: /etc/vector/vector.toml
        - name: AWS_REGION
          value: "us-west-2"
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector-s3-sync-config
      restartPolicy: Never
  backoffLimit: 0
