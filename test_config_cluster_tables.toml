[sources.tidb_system_tables]
type = "system_tables"

# Database connection configuration
database_username = "root"
database_password = ""
database_host = "127.0.0.1"
database_port = 4000
database_name = "information_schema"
database_max_connections = 5
database_connect_timeout = 30

# PD configuration (for topology discovery)
pd_address = "127.0.0.1:2379"

# Database TLS configuration (for schema fetching and HTTP API calls)
database_tls.verify_certificate = false
database_tls.verify_hostname = false
# database_tls.ca_file = "/path/to/ca.pem"  # Optional: CA certificate file
# database_tls.crt_file = "/path/to/client.pem"  # Optional: Client certificate file
# database_tls.key_file = "/path/to/client-key.pem"  # Optional: Client private key file

# PD TLS configuration (for topology discovery)
pd_tls.verify_certificate = false
pd_tls.verify_hostname = false
# pd_tls.ca_file = "/path/to/pd-ca.pem"  # Optional: PD CA certificate file
# pd_tls.crt_file = "/path/to/pd-client.pem"  # Optional: PD client certificate file
# pd_tls.key_file = "/path/to/pd-client-key.pem"  # Optional: PD client private key file

# Nextgen mode configuration
tidb_group = "default"  # Required for nextgen mode

# Collection configuration
short_interval = 5
long_interval = 30
retention_days = 1
topology_fetch_interval_seconds = 10.0

# Collection method configuration
collection_method = "coprocessor"  # Use coprocessor for cluster tables

# Test CLUSTER_STATEMENTS_SUMMARY table
[[sources.tidb_system_tables.tables]]
source_schema = "information_schema"
source_table = "CLUSTER_STATEMENTS_SUMMARY"
dest_table = "cluster_statements_summary"
collection_interval = "short"
enabled = true

# Test CLUSTER_TIDB_STATEMENTS_STATS table  
[[sources.tidb_system_tables.tables]]
source_schema = "information_schema"
source_table = "CLUSTER_TIDB_STATEMENTS_STATS"
dest_table = "cluster_tidb_statements_stats"
collection_interval = "short"
enabled = true

# Output to Delta Lake (local storage, using default partitioning)
[sinks.deltalake]
type = "deltalake"
inputs = ["tidb_system_tables"]
base_path = "./test_data/deltalake"
batch_size = 100
timeout_secs = 30
compression = "snappy"

# Local storage options
[sinks.deltalake.storage_options]
# Use local file system
"file.enable_move" = "true"
